<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="same-origin"><title>生徒用ログイン｜生物学習ポータル</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f7f2;color:#243c32;font-family:Meiryo,'Yu Gothic',sans-serif;line-height:1.9}header{padding:22px 30px;border-bottom:1px solid #d8ded3;font-weight:bold}main{max-width:510px;margin:8vh auto;padding:30px}h1{font-size:27px;margin:0 0 20px}p{font-size:14px;color:#647269}label{display:block;font-size:14px;font-weight:bold;margin:28px 0 8px}input{width:100%;padding:13px;border:1px solid #9cae9d;border-radius:5px;font:inherit;background:#fff}button{width:100%;padding:13px;margin-top:20px;border:0;border-radius:5px;background:#244e40;color:white;font:inherit;font-weight:bold;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.error{color:#9b332d;min-height:2em}small{display:block;color:#647269;font-size:12px;margin-top:25px}a{color:#244e40}:focus-visible{outline:3px solid #b67828;outline-offset:3px}
</style></head><body><header>生物学習ポータル</header><main><h1>生徒用ログイン</h1><p>授業で案内されたパスワードを入力してください。</p><form id="unlockForm"><label for="password">パスワード</label><input id="password" type="password" autocomplete="off" required maxlength="256" autocapitalize="off" spellcheck="false"><button id="open" type="submit" disabled>教材を開く</button><p id="status" class="error" role="status" aria-live="polite">準備しています…</p></form><small>授業を受ける生徒向けの教材です。URL・パスワード・教材を他の人に渡さないでください。<br>パスワードはサーバーに送信せず、この端末で教材を開くために使います。</small><noscript><p>教材を開くにはJavaScriptを有効にしてください。</p></noscript></main><script src="unlock.js"></script></body></html>
